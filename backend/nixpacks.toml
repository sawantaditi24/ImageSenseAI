# Nixpacks configuration for Koyeb/Railway
# This ensures Python 3.12 and Tesseract are available

[phases.setup]
nixPkgs = ["python312", "tesseract"]

[phases.install]
cmds = [
  "pip install --upgrade pip setuptools wheel",
  "pip install -r requirements.txt"
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"

